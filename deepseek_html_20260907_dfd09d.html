                <div class="card"><div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Brand</th><th>Model</th><th>Quantity</th><th>Potential Revenue</th><th>Status</th></tr></thead>
                    <tbody>${db.demands.map(d=>`<tr><td>${d.brand||'—'}</td><td>${d.model||'—'}</td><td>${d.quantity}</td><td>${formatCurrency(d.budget||0)}</td><td>${d.status}</td></tr>`).join('')}</tbody>
                </table></div></div></div>
            `;
        }

        function renderVendorReports() {
            return `
                <div class="page-header"><div><div class="page-title">Vendor Reports</div></div></div>
                <div class="card"><div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Vendor</th><th>Products</th><th>Payment Terms</th><th>Credit Limit</th><th>Outstanding</th></tr></thead>
                    <tbody>${db.vendors.map(v=>`<tr><td>${v.vendorName}</td><td>${v.products||'—'}</td><td>${v.paymentTerms||'—'}</td><td>${formatCurrency(v.creditLimit||0)}</td><td>${formatCurrency(v.outstandingPayable||0)}</td></tr>`).join('')}</tbody>
                </table></div></div></div>
            `;
        }

        function renderEmployeeReports() {
            return `
                <div class="page-header"><div><div class="page-title">Employee Reports</div></div></div>
                <div class="card"><div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Employee</th><th>Position</th><th>Department</th><th>Joining Date</th><th>Status</th></tr></thead>
                    <tbody>${db.employees.map(e=>`<tr><td>${e.fullName}</td><td>${e.position}</td><td>${e.department}</td><td>${formatDate(e.joiningDate)}</td><td>${e.status}</td></tr>`).join('')}</tbody>
                </table></div></div></div>
            `;
        }

        // ============================================================
        // DOCUMENTS
        // ============================================================
        function renderDocuments() {
            return `
                <div class="page-header"><div><div class="page-title">Documents</div>
                <div class="page-subtitle">${db.documents.length} documents</div></div>
                <div class="page-actions"><button class="btn btn-primary" onclick="openDocumentModal()">+ Upload</button></div></div>
                <div class="card"><div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>File Name</th><th>Type</th><th>Category</th><th>Uploaded By</th><th>Date</th></tr></thead>
                    <tbody>${db.documents.map(d=>`<tr><td>${d.fileName}</td><td>${d.fileType}</td><td>${d.category}</td><td>${db.employees.find(e=>e.id===d.uploadedBy)?.fullName||'—'}</td><td>${formatDate(d.uploadedAt)}</td></tr>`).join('')}</tbody>
                </table></div></div></div>
            `;
        }

        function openDocumentModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal" style="max-width:450px;">
                    <div class="modal-header"><h2>Upload Document</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
                    <div class="modal-body">
                        <div class="form-grid">
                            <div class="form-group"><label>File Name</label><input type="text" id="docName" /></div>
                            <div class="form-group"><label>File Type</label><select id="docType"><option>PDF</option><option>Image</option><option>Other</option></select></div>
                            <div class="form-group"><label>Category</label><select id="docCategory"><option>Company</option><option>Customer</option><option>Product</option><option>Warranty</option><option>Other</option></select></div>
                        </div>
                        <p class="text-muted mt-4">Prototype: file upload simulated with metadata only.</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button class="btn btn-primary" onclick="saveDocument()">Save</button>
                    </div>
                </div>
            `;
            modalContainer.innerHTML = '';
            modalContainer.appendChild(modal);
        }

        function saveDocument() {
            const name = document.getElementById('docName')?.value.trim();
            if (!name) { showToast('File name required', 'error'); return; }
            db.documents.push({
                id: generateId('document'),
                fileName: name,
                fileType: document.getElementById('docType')?.value || 'PDF',
                category: document.getElementById('docCategory')?.value || 'Other',
                relatedEntity: null,
                uploadedBy: session?.userId || '',
                uploadedAt: now(),
                notes: '',
            });
            saveDatabase();
            showToast('Document saved', 'success');
            closeModal();
            renderContent();
        }

        // ============================================================
        // SETTINGS
        // ============================================================
        function renderSettings() {
            const s = db.settings;
            return `
                <div class="page-header"><div><div class="page-title">Settings</div>
                <div class="page-subtitle">Company and system configuration</div></div></div>
                <div class="form-grid">
                    <div class="card"><div class="card-header"><h3>Company Profile</h3></div><div class="card-body">
                        <div class="form-grid">
                            <div class="form-group"><label>Company Name</label><input type="text" id="stCompanyName" value="${s.companyName}" /></div>
                            <div class="form-group"><label>Legal Name</label><input type="text" id="stLegalName" value="${s.legalName}" /></div>
                            <div class="form-group"><label>Trade Name</label><input type="text" id="stTradeName" value="${s.tradeName}" /></div>
                            <div class="form-group"><label>Tagline</label><input type="text" id="stTagline" value="${s.tagline}" /></div>
                            <div class="form-group"><label>Address</label><input type="text" id="stAddress" value="${s.address}" /></div>
                            <div class="form-group"><label>City</label><input type="text" id="stCity" value="${s.city}" /></div>
                            <div class="form-group"><label>Area</label><input type="text" id="stArea" value="${s.area}" /></div>
                            <div class="form-group"><label>Country</label><input type="text" id="stCountry" value="${s.country}" /></div>
                            <div class="form-group"><label>Postal Code</label><input type="text" id="stPostal" value="${s.postalCode}" /></div>
                            <div class="form-group"><label>Phone</label><input type="text" id="stPhone" value="${s.phone}" /></div>
                            <div class="form-group"><label>WhatsApp</label><input type="text" id="stWhatsapp" value="${s.whatsapp}" /></div>
                            <div class="form-group"><label>Email</label><input type="email" id="stEmail" value="${s.email}" /></div>
                            <div class="form-group"><label>Website</label><input type="text" id="stWebsite" value="${s.website}" /></div>
                            <div class="form-group"><label>VAT/TRN</label><input type="text" id="stVat" value="${s.vatTRN}" /></div>
                            <div class="form-group"><label>Registration Number</label><input type="text" id="stReg" value="${s.registrationNumber}" /></div>
                        </div>
                    </div></div>
                    <div class="card"><div class="card-header"><h3>Document Settings</h3></div><div class="card-body">
                        <div class="form-grid">
                            <div class="form-group"><label>Currency</label><input type="text" id="stCurrency" value="${s.currency}" /></div>
                            <div class="form-group"><label>Invoice Prefix</label><input type="text" id="stInvPrefix" value="${s.invoicePrefix}" /></div>
                            <div class="form-group"><label>Quotation Prefix</label><input type="text" id="stQuotPrefix" value="${s.quotationPrefix}" /></div>
                            <div class="form-group"><label>Tax Rate (%)</label><input type="number" id="stTaxRate" step="0.1" value="${s.taxRate}" /></div>
                            <div class="form-group"><label>Warranty (Months)</label><input type="number" id="stWarranty" value="${s.warrantyMonths}" /></div>
                            <div class="form-group"><label>Low Stock Threshold</label><input type="number" id="stLowStock" value="${s.lowStockThreshold}" /></div>
                            <div class="form-group" style="grid-column:1/-1;"><label>Footer</label><textarea id="stFooter">${s.footer}</textarea></div>
                        </div>
                    </div></div>
                </div>
                <div class="form-actions mt-4">
                    <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
                </div>
                <div class="card mt-4"><div class="card-header"><h3>Data Management</h3></div><div class="card-body">
                    <div class="flex gap-2" style="flex-wrap:wrap;">
                        <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
                        <button class="btn btn-secondary" onclick="importJSON()">Import JSON</button>
                        <button class="btn btn-secondary" onclick="backupData()">Backup</button>
                        <button class="btn btn-danger" onclick="resetDemoData()">Reset Demo Data</button>
                    </div>
                    <p class="text-muted mt-4">Data is stored locally in your browser. Export for backup.</p>
                </div></div>
            `;
        }

        function saveSettings() {
            const s = db.settings;
            s.companyName = document.getElementById('stCompanyName')?.value || s.companyName;
            s.legalName = document.getElementById('stLegalName')?.value || s.legalName;
            s.tradeName = document.getElementById('stTradeName')?.value || s.tradeName;
            s.tagline = document.getElementById('stTagline')?.value || s.tagline;
            s.address = document.getElementById('stAddress')?.value || s.address;
            s.city = document.getElementById('stCity')?.value || s.city;
            s.area = document.getElementById('stArea')?.value || s.area;
            s.country = document.getElementById('stCountry')?.value || s.country;
            s.postalCode = document.getElementById('stPostal')?.value || s.postalCode;
            s.phone = document.getElementById('stPhone')?.value || s.phone;
            s.whatsapp = document.getElementById('stWhatsapp')?.value || s.whatsapp;
            s.email = document.getElementById('stEmail')?.value || s.email;
            s.website = document.getElementById('stWebsite')?.value || s.website;
            s.vatTRN = document.getElementById('stVat')?.value || s.vatTRN;
            s.registrationNumber = document.getElementById('stReg')?.value || s.registrationNumber;
            s.currency = document.getElementById('stCurrency')?.value || s.currency;
            s.invoicePrefix = document.getElementById('stInvPrefix')?.value || s.invoicePrefix;
            s.quotationPrefix = document.getElementById('stQuotPrefix')?.value || s.quotationPrefix;
            s.taxRate = parseFloat(document.getElementById('stTaxRate')?.value) || 5;
            s.warrantyMonths = parseInt(document.getElementById('stWarranty')?.value) || 12;
            s.lowStockThreshold = parseInt(document.getElementById('stLowStock')?.value) || 3;
            s.footer = document.getElementById('stFooter')?.value || '';
            saveDatabase();
            showToast('Settings saved', 'success');
        }

        // ============================================================
        // AUDIT LOG
        // ============================================================
        function renderAuditLog() {
            return `
                <div class="page-header"><div><div class="page-title">Audit Log</div>
                <div class="page-subtitle">${db.auditLogs.length} entries</div></div></div>
                <div class="card"><div class="card-body"><div class="table-container"><table>
                    <thead><tr><th>Timestamp</th><th>Action</th><th>Entity</th><th>Details</th><th>User</th></tr></thead>
                    <tbody>${db.auditLogs.slice().reverse().map(l=>{
                        const user=db.users.find(u=>u.id===l.userId);
                        return `<tr>
                            <td>${formatDate(l.timestamp)}</td>
                            <td>${l.action}</td>
                            <td>${l.entityType}</td>
                            <td>${l.details}</td>
                            <td>${user?.fullName||'System'}</td>
                        </tr>`;
                    }).join('')}</tbody>
                </table></div></div></div>
            `;
        }

        // ============================================================
        // UTILITIES
        // ============================================================
        function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast' + (type ? ' toast-' + type : '');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        function callPhone(phone) {
            if (phone) showToast('Calling ' + phone + '... (prototype)', 'warning');
            else showToast('No phone number', 'error');
        }

        function waLink(phone) {
            if (phone) {
                const cleanPhone = phone.replace(/[^0-9]/g, '');
                window.open('https://wa.me/' + cleanPhone, '_blank');
            } else showToast('No WhatsApp number', 'error');
        }

        function exportJSON() {
            const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'lapdesk_backup_' + todayISO() + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported', 'success');
        }

        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.customers && data.products && data.invoices) {
                            db = data;
                            saveDatabase();
                            showToast('Data imported successfully', 'success');
                            renderContent();
                        } else {
                            showToast('Invalid data format', 'error');
                        }
                    } catch (err) {
                        showToast('Error importing: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function backupData() {
            exportJSON();
        }

        function resetDemoData() {
            if (confirm('Reset all data to demo defaults? This cannot be undone.')) {
                localStorage.removeItem(DB_KEY);
                db = loadDatabase();
                showToast('Demo data reset', 'success');
                renderContent();
            }
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function initApp() {
            // Close dropdown on outside click
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.user-badge')) closeUserDropdown();
                if (!e.target.closest('.sidebar') && !e.target.closest('.mobile-toggle') && document
                    .getElementById('sidebar')?.classList.contains('open')) {
                    closeMobileSidebar();
                }
            });

            // Mobile sidebar toggle
            document.getElementById('mobileToggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('show');
            });
            document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);

            // Global search input (topbar)
            document.getElementById('globalSearchInput').addEventListener('input', (e) => {
                const q = e.target.value.trim();
                const resultsDiv = document.getElementById('globalSearchResults');
                if (q.length < 2) { resultsDiv.style.display = 'none'; return; }
                const custMatches = db.customers.filter(c => c.companyName.toLowerCase().includes(q
                    .toLowerCase()) || c.mainPhone.includes(q)).slice(0, 5);
                const prodMatches = db.products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || p.sku
                    .toLowerCase().includes(q.toLowerCase())).slice(0, 3);
                let html = '';
                if (custMatches.length) {
                    html += custMatches.map(c =>
                        `<div style="padding:8px 12px;cursor:pointer;" onclick="openCustomerModal('${c.id}');document.getElementById('globalSearchResults').style.display='none';">${c.companyName} — ${c.mainPhone}</div>`
                        ).join('');
                }
                if (prodMatches.length) {
                    html += prodMatches.map(p =>
                        `<div style="padding:8px 12px;cursor:pointer;" onclick="openProductModal('${p.id}');document.getElementById('globalSearchResults').style.display='none';">${p.name} — ${p.sku}</div>`
                        ).join('');
                }
                if (!html) html = '<div style="padding:8px 12px;">No results</div>';
                resultsDiv.innerHTML = html;
                resultsDiv.style.display = 'block';
            });

            // Hide search results on blur
            document.getElementById('globalSearchInput').addEventListener('blur', () => {
                setTimeout(() => { document.getElementById('globalSearchResults').style.display = 'none'; }, 200);
            });

            // Auto-login if session exists
            if (session) {
                const user = db.users.find(u => u.id === session.userId);
                if (user && user.active) {
                    renderApp();
                } else {
                    session = null;
                    saveSession();
                    renderAuth('signin');
                }
            } else {
                renderAuth('signin');
            }
        }

        // Initialize on DOM ready
        document.addEventListener('DOMContentLoaded', initApp);

        // Handle window resize for responsive
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) closeMobileSidebar();
        });
    </script>
</body>
</html>
